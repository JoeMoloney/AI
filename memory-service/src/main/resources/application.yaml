spring:
  application:
    name: ai-memory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_memory}
    username: ${DB_USER:ai_memory}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  management:
    endpoints:
      web:
        exposure:
          include: health,info