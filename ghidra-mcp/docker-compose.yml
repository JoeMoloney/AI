x-ghidra-volumes: &ghidra-volumes
  - ${GHIDRA_DATA}/data:/data:ro
  - ${GHIDRA_DATA}/projects:/projects
  - ${GHIDRA_DATA}/exports:/exports
  - ${GHIDRA_DATA}/scripts:/scripts:ro
  - ${GHIDRA_DATA}/logs:/logs

services:
  ghidra-mcp:
    build:
      context: .
      target: mcp
    image: ghidra-mcp:local
    container_name: ghidra-mcp
    restart: "on-failure:3"
    init: true
    stop_grace_period: 2m
    environment:
      # Set this in .env to select exactly one file under /data.
      GHIDRA_BINARY: ${GHIDRA_BINARY:-}
      GHIDRA_PROJECT_NAME: ${GHIDRA_PROJECT_NAME:-}
      _JAVA_OPTIONS: "-Xmx${GHIDRA_MAXMEM:-4G}"
    ports:
      - "127.0.0.1:18081:18081"
    volumes: *ghidra-volumes
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /home/ghidra:rw,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - selfhost_network

  # Optional utility container for manual analyzeHeadless/script work.
  # The MCP service embeds Ghidra itself and does not depend on this container.
  ghidra-headless:
    profiles:
      - manual
    build:
      context: .
      target: ghidra
    image: ghidra-headless:local
    container_name: ghidra-headless
    init: true
    environment:
      GHIDRA_MAXMEM: ${GHIDRA_MAXMEM:-4G}
    volumes: *ghidra-volumes
    networks:
      - selfhost_network

networks:
  selfhost_network:
    external: true
