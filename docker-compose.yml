services:
  # ===== General AI Services =====
  open-webui:
    extends:
      file: ./open-webui/docker-compose.yml
      service: open-webui
    networks: 
      - selfhost_network
  ollama:
    extends:
      file: ./open-webui/docker-compose.yml
      service: ollama
    networks: 
      - selfhost_network

  # ===== Memory Database Services =====
  memory-db:
    extends:
      file: ./memory-db/docker-compose.yml
      service: memory-db
    networks: 
      - selfhost_network
  memory-service:
    extends:
      file: ./memory-service/docker-compose.yml
      service: memory-service
    depends_on:
      memory-db:
        condition: service_healthy
    networks:
      - selfhost_network

  # ===== Web Browsing Services =====
  searxng:
    extends:
      file: ./searxng/docker-compose.yml
      service: searxng
    networks: 
      - selfhost_network
  
  # ===== Etc =====
  sillytavern:
    extends:
      file: ./sillytavern/docker-compose.yml
      service: sillytavern
    networks: 
      - selfhost_network

  # ===== Image-Gen Services =====
  comfyui:
    extends:
      file: ./comfyui/docker-compose.yml
      service: comfyui
    networks: 
      - selfhost_network

  # ===== Reverse Engineering Services =====
  ghidra-mcp:
    extends:
      file: ./ghidra-mcp/docker-compose.yml
      service: ghidra-mcp
    networks:
      - selfhost_network

networks:
  selfhost_network:
    name: selfhost_network
    external: true
