services:
  # ===== General AI Services =====
  open-webui:
    extends:
      file: ./open-webui/docker-compose.yml
      service: open-webui
    networks: 
      - selfhost_network
  ollama:
    extends:
      file: ./open-webui/docker-compose.yml
      service: ollama
    networks: 
      - selfhost_network

  # ===== Memory Database Services =====
  memory-db:
    extends:
      file: ./memory-db/docker-compose.yml
      service: memory-db
    networks: 
      - selfhost_network
  memory-service:
    extends:
      file: ./memory-service/docker-compose.yml
      service: memory-service
    depends_on:
      memory-db:
        condition: service_healthy
    networks:
      - selfhost_network

  # ===== Web Browsing Services =====
  searxng:
    extends:
      file: ./searxng/docker-compose.yml
      service: searxng
    networks: 
      - selfhost_network
  
  # ===== Etc =====
  sillytavern:
    extends:
      file: ./sillytavern/docker-compose.yml
      service: sillytavern
    networks: 
      - selfhost_network

  # ===== Image-Gen Services =====
  comfyui:
    extends:
      file: ./comfyui/docker-compose.yml
      service: comfyui
    networks: 
      - selfhost_network

  # ===== Reverse Engineering Services =====
  ghidra-mcp:
    extends:
      file: ./ghidra-mcp/docker-compose.yml
      service: ghidra-mcp
    networks:
      - selfhost_network

  pcsx2-pine:
    build:
      context: .
      dockerfile: pcsx2-pine/Dockerfile
    image: pcsx2-pine-mcp:local
    container_name: pcsx2-pine
    restart: unless-stopped
    init: true
    environment:
      MCP_PORT: 18083
      PCSX2_PINE_SOCKET: /pine/pcsx2.sock
    # PINE's host socket is owner-restricted; match the desktop user by default.
    user: "${PCSX2_UID:-1000}:${PCSX2_GID:-1000}"
    volumes:
      - ${PCSX2_RUNTIME_DIR:-/run/user/1000}:/pine:ro
    ports:
      - "127.0.0.1:18083:18083"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [selfhost_network]

  x360-recomp-analysis:
    build:
      context: .
      dockerfile: x360/recomp-mcp/Dockerfile
    image: x360-recomp-analysis-mcp:local
    container_name: x360-recomp-analysis
    restart: unless-stopped
    init: true
    environment:
      MCP_PORT: 18084
      X360_ANALYSIS_CONFIG: /config/targets.properties
    volumes:
      - ${X360_ANALYSIS_CONFIG:-/home/ol-randals/.config/opencode/x360-targets.properties}:/config/targets.properties:ro
      - ${X360_DATA_ROOT:-/mnt/HDD/git_stuff}:${X360_DATA_ROOT:-/mnt/HDD/git_stuff}:ro
    ports:
      - "127.0.0.1:18084:18084"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [selfhost_network]

networks:
  selfhost_network:
    name: selfhost_network
    external: true
