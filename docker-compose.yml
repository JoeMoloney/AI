services:
  open-webui:
    extends:
      file: ./open-webui/docker-compose.yml
      service: open-webui
    networks: 
      - selfhost_network
  ollama:
    extends:
      file: ./open-webui/docker-compose.yml
      service: ollama
    networks: 
      - selfhost_network
  searxng:
    extends:
      file: ./searxng/docker-compose.yml
      service: searxng
    networks: 
      - selfhost_network
  
  sillytavern:
    extends:
      file: ./sillytavern/docker-compose.yml
      service: sillytavern
    networks: 
      - selfhost_network

  comfyui:
    extends:
      file: ./sillytavern/docker-compose.yml
      service: comfyui
    networks: 
      - selfhost_network

networks:
  selfhost_network:
    driver: bridge