services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    environment:
      WEBUI_AUTH: "True"
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_WEB_SEARCH: "True"
      ENABLE_LOCAL_WEB_FETCH: "True"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: "8"
      WEB_SEARCH_CONCURRENT_REQUESTS: "5"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      COMFYUI_IMAGE_TOOL_DIR: /custom_tools/comfyui_image
      ENABLE_FUNCTIONS: "True"
      ENABLE_PLUGINS: "True"
      # Persistent signing secret from .apiKey, not an Open WebUI API token.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY from open-webui/.apiKey}
      FILE_IMAGE_COMPRESSION_WIDTH: "1024"
      FILE_IMAGE_COMPRESSION_HEIGHT: "1024"
    ports:
      - "127.0.0.1:3000:8080"
      # Trusted LAN access for phones; update if this host's Wi-Fi IP changes.
      - "192.168.1.50:3000:8080"
    volumes:
      - ${OPENWEBUI_DATA}:/app/backend/data
      - ${COMFYUI_WORKFLOWS}:/comfyui_workflows
      - ${OPENWEBUI_CUSTOMTOOLS}:/custom_tools
    networks: 
      - selfhost_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_CONTEXT_LENGTH=131072
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    ports: [ "127.0.0.1:11434:11434", "192.168.1.50:11434:11434" ]
    volumes:
      - ${OLLAMA_DATA}:/root/.ollama
    devices:
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-modeset
      - /dev/nvidiactl
      - /dev/nvidia0
    networks: 
      - selfhost_network

networks:
  selfhost_network:
    external: true
